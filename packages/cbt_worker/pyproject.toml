[project]
name = "cbt-worker"
version = "0.1.0"
description = "Central Bank Tone ingestion worker: scrapes speeches and ingests them. Depends on cbt-core only."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cbt-core",
  "httpx>=0.27",
  "pdfminer-six>=20260107",
  "pillow>=12.2.0",
  "pypdfium2>=5.9.0",
  "selectolax>=0.3",
]

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cbt_worker"
module-root = "src"
