name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace (locked)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: Architecture invariants
        run: uv run python scripts/check_imports.py

      # The ubuntu runner has Docker, so testcontainers actually runs the Postgres + pgvector
      # integration tests (append-only triggers, FK semantics, migration round trip, vector
      # retrieval) that skip on a machine without Docker. The coverage gate (fail_under = 90)
      # is enforced here.
      - name: Tests (unit + integration, coverage gate)
        run: uv run pytest -m "not llm" --cov --cov-report=term-missing

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit
