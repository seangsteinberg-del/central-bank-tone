{% if error %}
<p class="answer-error">{{ error }}</p>
{% elif answer %}
<div class="answer {% if answer.abstained %}abstained{% endif %}">
  <p class="answer-text">{{ answer.text }}</p>
  {% if answer.citations %}
  <details class="citations" open>
    <summary>{{ answer.citations | length }} citation{{ "" if answer.citations | length == 1 else "s" }}</summary>
    <ul>
      {% for citation in answer.citations %}
      <li><a href="{{ citation.url }}" target="_blank" rel="noreferrer noopener">{{ citation.title }}</a></li>
      {% endfor %}
    </ul>
  </details>
  {% endif %}
</div>
{% endif %}
