[project]
name = "cbt-web"
version = "0.1.0"
description = "Central Bank Tone server-rendered web UI (Jinja + HTMX). Depends on cbt-core only."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cbt-core",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cbt_web"
module-root = "src"
