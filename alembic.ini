# Alembic configuration. The database URL is NOT set here; migrations/env.py reads it from
# cbt_core.settings (CLAUDE.md section 11) or from a URL supplied programmatically by the
# integration test. Run with: uv run alembic upgrade head
[alembic]
script_location = packages/cbt_core/src/cbt_core/persistence/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
