[project]
name = "cbt-api"
version = "0.1.0"
description = "Central Bank Tone FastAPI adapter. Depends on cbt-core only."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cbt-core",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cbt_api"
module-root = "src"
