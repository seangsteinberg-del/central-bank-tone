# Local Postgres + pgvector for development and the demo. The integration tests spin up their
# own throwaway container via testcontainers; this is the long-lived dev database.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cbt
      POSTGRES_PASSWORD: cbt
      POSTGRES_DB: cbt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbt -d cbt"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - cbt_pgdata:/var/lib/postgresql/data

volumes:
  cbt_pgdata:
